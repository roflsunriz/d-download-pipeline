name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Python セットアップ
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 依存関係を検査
        run: python -m pip check

      - name: 構文検査
        run: python -m compileall -q d_download_pipeline.py

      - name: ヘルプ表示
        run: python d_download_pipeline.py --help
